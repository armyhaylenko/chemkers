[package]
name = "game-server"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
ed25519-dalek = { version = "2.1.1", features = ["digest"] }
futures-util = "0.3.31"
hex = "0.4.3"
rand = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.44.0", features = ["full", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tokio-tungstenite = "0.26.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
warp = "0.3.7"
