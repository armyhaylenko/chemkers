[package]
name = "double-ratchet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm-siv = "0.11.1"
anyhow = "1.0.97"
generic-array = "0.14.7"
hkdf = "0.12.4"
hmac = "0.12.1"
js-sys = "0.3.77"
serde = { version = "1.0.218", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10.8"
typenum = "1.18.0"
wasm-bindgen = "0.2.100"
getrandom = { version = "0.2", features = ["js"]}
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "getrandom", "serde"] }

[profile.release]
lto = true
